[project]
name = "wallmpop"
version = "0.1.0"
description = "Cazador de chollos en Wallapop con bot de Telegram"
requires-python = ">=3.12"
dependencies = ["python-telegram-bot>=21,<23", "httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wallmpop*"]

[tool.setuptools.package-data]
wallmpop = ["prompts/*.md"]
